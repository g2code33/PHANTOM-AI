name: build-desktop

# PHANTOM + CODED — desktop + mobile release pipeline
#
# Pushing to `main` triggers:
#   - Windows installer (PhantomCoded-Setup-<ver>.exe + latest.yml)
#   - Linux packages (phantom-coded_<ver>_amd64.deb + PhantomCoded-<ver>.AppImage + latest-linux.yml)
#   - Android app (phantom-coded-<ver>.apk)
# all published to a GitHub Release automatically (no tags required).
#
# The editable copy of this file lives at docs/workflow-build-desktop.yml
# (bot tokens usually lack the Workflows permission to push .github/workflows/).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Non-main builds (PRs / manual runs): compile + upload artifacts only.
  # ------------------------------------------------------------------
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build backend bundle (PyInstaller)
        run: |
          python -m pip install --quiet fastapi uvicorn httpx aiosqlite pydantic jsonschema psutil cryptography pyinstaller
          python -m PyInstaller --noconfirm --distpath dist-backend --workpath build/pyinstaller-work build/backend.spec

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets
        run: npm run web:build

      - name: Compile Electron main
        run: npm run build:electron

      - name: Build desktop installers
        run: npx electron-builder

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.yml
            release/*.deb
            release/*.AppImage

      - name: Sync Android project (ubuntu only)
        if: runner.os == 'Linux'
        run: npx cap sync android

      - name: Build debug APK (ubuntu only)
        if: runner.os == 'Linux'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact (ubuntu only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ------------------------------------------------------------------
  # Main-branch release: build + auto-publish to a GitHub Release.
  # ------------------------------------------------------------------
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EP_GH_IGNORE_TIME: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build backend bundle (PyInstaller)
        run: |
          python -m pip install --quiet fastapi uvicorn httpx aiosqlite pydantic jsonschema psutil cryptography pyinstaller
          python -m PyInstaller --noconfirm --distpath dist-backend --workpath build/pyinstaller-work build/backend.spec

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets
        run: npm run web:build

      - name: Build + publish installers to GitHub Release
        run: npm run dist -- --publish always

      - name: Upload desktop artifacts (belt-and-braces)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-release
          path: |
            release/*.exe
            release/*.yml
            release/*.deb
            release/*.AppImage

      # ---- Android (ubuntu leg only) ----
      - name: Set up JDK 21 (ubuntu only)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Android project (ubuntu only)
        if: runner.os == 'Linux'
        run: npx cap sync android

      - name: Build release APK (ubuntu only)
        if: runner.os == 'Linux'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to GitHub Release (ubuntu only)
        if: runner.os == 'Linux'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/apk/release/app-release.apk "phantom-coded-${VER}.apk"
          # Release is created by electron-builder in one of the matrix legs;
          # ensure it exists (no-op if already created), then attach the APK.
          gh release create "v${VER}" --generate-notes --title "v${VER}" 2>/dev/null || true
          gh release upload "v${VER}" "phantom-coded-${VER}.apk" --clobber
