[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-coded"
version = "0.1.0"
description = "PHANTOM + CODED — a personal AI computer operator: two independent AI entities (Phantom, Coded) on one shared agent framework, powered by NVIDIA NIM-compatible APIs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "psutil>=5.9",
    "websockets>=12",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gui = ["pyautogui>=0.9.54", "mss>=9.0"]
voice = ["resemblyzer>=0.2.0", "numpy>=1.24", "faster-whisper>=1.0"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["phantom_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
