<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phantom Companion</title>
<link rel="stylesheet" href="/mobile.css">
</head>
<body data-state="disconnected">
<div id="app">
  <!-- top: connection + presence -->
  <header id="mTop">
    <div class="mBrand">
      <div id="mMiniCore"></div>
      <div>
        <strong>Phantom</strong>
        <span id="mMode" class="mSub">companion</span>
      </div>
    </div>
    <div id="mStatusRow">
      <span id="mPresence" class="mPill">connecting…</span>
      <button id="mKill" class="mKill" title="Kill switch">⏻</button>
    </div>
  </header>

  <!-- connect screen (first run / offline) -->
  <div id="mConnect" class="mScreen">
    <div class="mCard">
      <h2>Connect to your PC</h2>
      <p class="muted small">Enter your computer's Phantom backend address (e.g. http://192.168.1.50:8000). Your PC must be on and Phantom running.</p>
      <input id="mUrl" type="url" placeholder="http://192.168.1.50:8000" autocomplete="url">
      <input id="mToken" type="password" placeholder="access token (optional)">
      <button id="mConnectBtn" class="mPrimary">Connect</button>
      <p id="mConnErr" class="mErr hidden"></p>
    </div>
  </div>

  <!-- main companion -->
  <div id="mMain" class="mScreen hidden">
    <section id="mToday" class="mSection">
      <div class="mSecHead"><h3>☀️ Today</h3><button id="mRefresh" class="mMini">refresh</button></div>
      <div id="mBriefing" class="mCard mBriefing"></div>
    </section>

    <section id="mConfirm" class="mSection hidden">
      <div class="mSecHead"><h3>🔔 Needs your approval</h3></div>
      <div id="mConfirmList" class="mStack"></div>
    </section>

    <section id="mTasks" class="mSection">
      <div class="mSecHead"><h3>📋 Active tasks</h3></div>
      <div id="mTaskList" class="mStack"></div>
    </section>

    <section id="mNotifs" class="mSection">
      <div class="mSecHead"><h3>🔔 Notifications</h3></div>
      <div id="mNotifList" class="mStack"></div>
    </section>
  </div>

  <!-- voice bar (tap to talk) -->
  <footer id="mVoiceBar" class="hidden">
    <div id="mVoiceHint" class="mHint"></div>
    <button id="mVoiceBtn" class="mBigMic">🎙️</button>
    <div class="mAgentRow">
      <button class="mAgent" data-a="phantom">👻 Phantom</button>
      <button class="mAgent" data-a="coded">💻 Coded</button>
    </div>
  </footer>
</div>
<script src="/mobile.js"></script>
</body>
</html>
